services:
  postgres:
    image: postgres:16
    container_name: learningetl-postgres-5435
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning_etl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - learningetl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_etl"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  learningetl_pgdata:
